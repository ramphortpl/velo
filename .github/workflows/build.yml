name: APK VeloGo

# À chaque push : tests, APK signé et fichier pour Google Play (toujours avec la même clé), essai de bout en bout
# sur un émulateur Android, puis, si tout a réussi, publication des deux dans les Releases.
# Pas sur « main » : cette branche ne reçoit, en avance rapide, que des commits déjà fabriqués et essayés sur une
# branche de travail. Les refabriquer publierait une seconde version identique, sous un autre numéro.
on:
  push:
    branches: ["claude/**"]
    paths-ignore:
      - "cartes/**"
      - ".github/workflows/cartes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ce que contient la mémoire des téléchargements : Gradle, ses extensions, les bibliothèques et les images
  # Android des tests. La liste doit être la même à la lecture et à l'écriture.
  MEMOIRE_CHEMINS: |
    ~/.gradle/caches
    ~/.gradle/wrapper
    ~/.m2/repository/org/robolectric

jobs:
  apk:
    name: Tests et APK signé
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
      signe: ${{ steps.cle.outputs.presente }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # La mémoire des téléchargements est gérée plus bas, à la main : celle de cette action n'écrit que depuis la
      # branche principale, et on veut choisir ce qui y entre et à quel moment.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: SDK Android (plateforme 37.1)
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-37.1" "build-tools;37.0.0" | grep -v '^\[' || true
          fi

      # Dès le début, pour le dire tout de suite : le secret est-il là, et ouvre-t-il bien la clé du dépôt ?
      - name: Clé de signature
        id: cle
        env:
          VELOGO_KEYSTORE_PASSWORD: ${{ secrets.VELOGO_KEYSTORE_PASSWORD }}
        run: |
          # Le mot de passe ne contient ni espace ni retour à la ligne : ceux qu'un copier-coller aurait ajoutés sont ignorés.
          MDP="$(printf '%s' "$VELOGO_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          if [ -z "$MDP" ]; then
            echo "presente=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret VELOGO_KEYSTORE_PASSWORD absent : les tests tournent mais aucun APK ne sera publié. Ajoute-le dans Settings > Secrets and variables > Actions."
            {
              echo "### Aucun APK publié"
              echo "Le secret \`VELOGO_KEYSTORE_PASSWORD\` n'existe pas encore dans ce dépôt."
              echo "Ajoute-le dans **Settings > Secrets and variables > Actions**, puis relance ce workflow (bouton *Re-run all jobs*)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif MDP="$MDP" keytool -list -keystore signing/velogo-release.p12 -storetype PKCS12 -storepass:env MDP > /dev/null 2>&1; then
            echo "presente=oui" >> "$GITHUB_OUTPUT"
            echo "Le secret ouvre bien la clé de signature."
          else
            echo "presente=fausse" >> "$GITHUB_OUTPUT"
            case "$MDP" in
              *[!A-Za-z0-9]*) NATURE=" et contient autre chose que des lettres et des chiffres" ;;
              *) NATURE="" ;;
            esac
            echo "::error::Le secret VELOGO_KEYSTORE_PASSWORD n'ouvre pas la clé de signature : il fait ${#MDP} caractères${NATURE}, alors que le mot de passe en fait 40 (lettres et chiffres uniquement). Aucun APK ne sera publié."
            {
              echo "### Le secret de signature n'est pas le bon"
              echo "Le secret \`VELOGO_KEYSTORE_PASSWORD\` existe, mais il n'ouvre pas la clé \`signing/velogo-release.p12\` :"
              echo "il fait ${#MDP} caractères${NATURE}, alors que le mot de passe en fait 40 (lettres et chiffres uniquement)."
              echo
              echo "Pour le corriger : **Settings > Secrets and variables > Actions**, le crayon à côté de \`VELOGO_KEYSTORE_PASSWORD\`,"
              echo "colle le mot de passe exact, **Update secret**, puis relance ce workflow (bouton *Re-run all jobs*)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Les cartes de Mapbox ne sont dans l'appli que si le jeton public du compte Mapbox de l'auteur est rangé dans
      # le secret MAPBOX_ACCESS_TOKEN. On dit ici s'il est là et s'il a la bonne forme, sans jamais l'écrire.
      # Le fond « Mapbox Satellite » en plus : seulement si la variable MAPBOX_SATELLITE du dépôt vaut « oui ».
      # Mapbox n'envoie ses images satellite qu'aux comptes qui ont un moyen de paiement ; sans cela, il les refuse.
      - name: Jeton Mapbox
        id: mapbox
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_SATELLITE: ${{ vars.MAPBOX_SATELLITE }}
        run: |
          case "$(printf '%s' "$MAPBOX_SATELLITE" | tr -d '[:space:]' | tr 'A-Z' 'a-z')" in
            oui|true|1|yes) echo "Variable MAPBOX_SATELLITE : le fond « Mapbox Satellite » sera proposé avec les cartes de Mapbox." ;;
            *) echo "Variable MAPBOX_SATELLITE absente : le fond « Mapbox Satellite » ne sera pas proposé (il demande un compte Mapbox avec un moyen de paiement)." ;;
          esac
          JETON="$(printf '%s' "$MAPBOX_ACCESS_TOKEN" | tr -d '[:space:]')"
          if [ -z "$JETON" ]; then
            echo "present=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret MAPBOX_ACCESS_TOKEN absent : l'appli est fabriquée sans les cartes de Mapbox."
            {
              echo "### Sans les cartes de Mapbox"
              echo "Le secret \`MAPBOX_ACCESS_TOKEN\` n'existe pas dans ce dépôt : l'appli est fabriquée sans les fonds « Mapbox »."
              echo "Pour les ajouter : copie le jeton public (« Default public token », il commence par \`pk.\`) de ton compte Mapbox"
              echo "dans **Settings > Secrets and variables > Actions > New repository secret**, sous le nom \`MAPBOX_ACCESS_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$JETON" | grep -Eq '^pk\.[A-Za-z0-9._-]+$'; then
            echo "present=oui" >> "$GITHUB_OUTPUT"
            echo "Le jeton Mapbox est un jeton public : les cartes de Mapbox seront dans l'appli."
          else
            echo "present=faux" >> "$GITHUB_OUTPUT"
            case "$JETON" in
              sk.*) QUOI="c'est un jeton secret (il commence par « sk. »), qui ne doit jamais être mis dans une appli : supprime-le dans ton compte Mapbox, il n'est plus sûr" ;;
              *) QUOI="il ne commence pas par « pk. » ou contient des caractères inattendus" ;;
            esac
            echo "::warning::Le secret MAPBOX_ACCESS_TOKEN n'est pas un jeton public de Mapbox : $QUOI. L'appli est fabriquée sans les cartes de Mapbox."
            {
              echo "### Le jeton Mapbox n'est pas le bon"
              echo "Le secret \`MAPBOX_ACCESS_TOKEN\` existe, mais $QUOI."
              echo "Il faut le jeton public de ton compte Mapbox (« Default public token », il commence par \`pk.\`) :"
              echo "**Settings > Secrets and variables > Actions**, le crayon à côté de \`MAPBOX_ACCESS_TOKEN\`, puis **Update secret**."
              echo "En attendant, l'appli est fabriquée sans les fonds « Mapbox »."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Ce qu'une fabrication précédente a déjà téléchargé. Sans cela tout dépend, à chaque fois, de dépôts de
      # bibliothèques qui refusent parfois de répondre aux machines de GitHub (« Plugin … was not found »).
      # « v2 » : les tests de la source GPS tournent aussi sur Android 8 et 11 simulés, deux images à télécharger
      # en plus.
      - name: Mémoire des téléchargements
        id: memoire
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MEMOIRE_CHEMINS }}
          key: telechargements-v2-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          # À défaut de la mémoire exacte, la plus récente sert de point de départ : seules les bibliothèques
          # nouvelles restent à télécharger.
          restore-keys: |
            telechargements-v2-

      - name: Outils de construction
        run: bash outils/ci_outils_de_construction.sh

      # Les vérifications Android portent sur les deux versions : celle des Releases GitHub et celle de Google Play.
      # Le jeton Mapbox n'est pas donné ici : les tests vérifient au passage qu'il n'est pas dans le dépôt.
      - name: Tests et vérifications
        run: |
          ./gradlew test :app:lintGithubDebug :app:lintPlayRelease --console=plain
          # Les textes de la fiche Google Play ne doivent pas dépasser les longueurs du magasin.
          python3 outils/fiche_play.py

      - name: Numéro de version
        id: version
        run: |
          MAJOR=$(grep '^major=' version.properties | cut -d= -f2)
          MINOR=$(grep '^minor=' version.properties | cut -d= -f2)
          echo "name=$MAJOR.$MINOR.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Quand la mémoire des téléchargements est à (ré)écrire, la version publiable est d'abord construite sans la
      # signer, donc sans le mot de passe de la clé : les versions au code réduit demandent des bibliothèques que
      # les tests ne téléchargent pas, et la mémoire doit les contenir.
      - name: Version publiable non signée (pour compléter la mémoire)
        if: steps.memoire.outputs.cache-hit != 'true'
        run: |
          ./gradlew :app:assembleGithubRelease :app:bundlePlayRelease --console=plain \
            -Pvelogo.buildNumber=${{ github.run_number }} \
            -Pvelogo.githubRepo=${{ github.repository }}

      # La mémoire est écrite ici, par ce job seulement : il a téléchargé tout ce qu'il faut aux tests comme à la
      # version publiée, et Gradle n'a pas encore reçu le mot de passe de la clé. Elle ne peut donc pas le
      # contenir (sur un dépôt public, elle peut être relue par d'autres). Elle n'est réécrite que si les versions
      # des outils ou des bibliothèques ont changé.
      - name: Préparer la mémoire des téléchargements
        if: steps.memoire.outputs.cache-hit != 'true'
        run: |
          ./gradlew --stop
          # Les résultats de compilation n'ont pas leur place dans cette mémoire : seulement les téléchargements.
          rm -rf ~/.gradle/caches/build-cache-1
          du -sh ~/.gradle/caches ~/.gradle/wrapper ~/.m2/repository/org/robolectric 2>/dev/null || true

      - name: Garder les téléchargements en mémoire
        if: steps.memoire.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MEMOIRE_CHEMINS }}
          key: ${{ steps.memoire.outputs.cache-primary-key }}

      - name: Secret de signature incorrect
        if: steps.cle.outputs.presente == 'fausse'
        run: |
          echo "::error::Les tests sont passés, mais le secret VELOGO_KEYSTORE_PASSWORD n'ouvre pas la clé de signature : aucun APK publié. La marche à suivre est dans le résumé de cette exécution."
          exit 1

      # Deux fichiers, signés de la même clé : l'APK des Releases GitHub, et le fichier « AAB » que demande
      # Google Play (même appli, sans la mise à jour par GitHub).
      - name: APK signé et fichier pour Google Play
        if: steps.cle.outputs.presente == 'oui'
        env:
          VELOGO_KEYSTORE_PASSWORD: ${{ secrets.VELOGO_KEYSTORE_PASSWORD }}
          # Comme le mot de passe de la clé, le jeton Mapbox n'arrive à Gradle qu'après l'écriture de la mémoire.
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_SATELLITE: ${{ vars.MAPBOX_SATELLITE }}
        run: |
          ./gradlew :app:assembleGithubRelease :app:bundlePlayRelease --console=plain \
            -Pvelogo.buildNumber=${{ github.run_number }} \
            -Pvelogo.githubRepo=${{ github.repository }}
          VERSION="${{ steps.version.outputs.name }}"
          APK=app/build/outputs/apk/github/release/app-github-release.apk
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          test -f "$APK" || { echo "::error::APK signé introuvable (mot de passe de la clé incorrect ?)"; ls -R app/build/outputs/apk; exit 1; }
          test -f "$AAB" || { echo "::error::Fichier pour Google Play introuvable"; ls -R app/build/outputs/bundle; exit 1; }
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          # Les bibliothèques natives doivent accepter les pages mémoire de 16 Ko (exigence de Google Play). Dans
          # cet APK elles sont compressées : on regarde donc chacune d'elles, et pas seulement leur place dans le fichier.
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          python3 outils/controle_apk.py pages "$APK"
          python3 outils/controle_apk.py pages "$AAB"
          # Le jeton Mapbox est-il dans l'appli quand il doit y être, et seulement alors ? (Il n'est écrit nulle part.)
          python3 outils/controle_apk.py mapbox "$APK" "${{ steps.mapbox.outputs.present }}"
          python3 outils/controle_apk.py mapbox "$AAB" "${{ steps.mapbox.outputs.present }}"
          # Le fichier pour Google Play doit porter la même signature que l'APK.
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::Le fichier pour Google Play n'est pas signé"; exit 1; }
          EMPREINTE_APK="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256' | head -n 1 | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')"
          EMPREINTE_AAB="$(keytool -printcert -jarfile "$AAB" | grep 'SHA256:' | head -n 1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "Empreinte de l'APK : $EMPREINTE_APK"
          echo "Empreinte du fichier pour Google Play : $EMPREINTE_AAB"
          test -n "$EMPREINTE_APK" && test "$EMPREINTE_APK" = "$EMPREINTE_AAB" || { echo "::error::L'APK et le fichier pour Google Play n'ont pas la même signature"; exit 1; }
          mkdir -p publication
          cp "$APK" "publication/VeloGo-$VERSION.apk"
          cp "$AAB" "publication/VeloGo-$VERSION-play.aab"

      - uses: actions/upload-artifact@v7
        if: steps.cle.outputs.presente == 'oui'
        with:
          name: VeloGo-${{ steps.version.outputs.name }}
          path: publication/

  essai:
    name: Essai sur émulateur Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # La mémoire des téléchargements est gérée plus bas, à la main : celle de cette action n'écrit que depuis la
      # branche principale, et on veut choisir ce qui y entre et à quel moment.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: SDK Android (plateforme 37.1)
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-37.1" "build-tools;37.0.0" | grep -v '^\[' || true
          fi

      # Lecture seule : c'est l'autre job qui écrit la mémoire, une fois ses tests passés.
      - name: Mémoire des téléchargements
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MEMOIRE_CHEMINS }}
          key: telechargements-v2-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          # À défaut de la mémoire exacte, la plus récente sert de point de départ : seules les bibliothèques
          # nouvelles restent à télécharger.
          restore-keys: |
            telechargements-v2-

      - name: Outils de construction
        run: bash outils/ci_outils_de_construction.sh

      # La version Play n'est pas construite directement en APK : on fabrique son fichier AAB, puis l'outil de
      # Google (bundletool, que le plugin Android embarque) en tire un APK, comme le fait le Play Store. C'est ce
      # chemin-là que l'émulateur essaie.
      # Le jeton public de Mapbox est-il là ? (L'autre job dit ce qui ne va pas s'il n'a pas la bonne forme.)
      # Le fond satellite de Mapbox est dans l'APK d'essai si la variable MAPBOX_SATELLITE du dépôt le demande, et
      # toujours quand l'essai va jusqu'à afficher une carte Mapbox (« [essai mapbox] ») : c'est le seul moyen de voir,
      # sur un vrai Android, ce que fait l'appli quand Mapbox refuse d'envoyer une carte (ce qu'il fait pour ses
      # images satellite tant que le compte n'a pas de moyen de paiement).
      - name: Jeton Mapbox
        id: mapbox
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_SATELLITE: ${{ contains(github.event.head_commit.message, '[essai mapbox]') && 'oui' || vars.MAPBOX_SATELLITE }}
        run: |
          if printf '%s' "$MAPBOX_ACCESS_TOKEN" | tr -d '[:space:]' | grep -Eq '^pk\.[A-Za-z0-9._-]+$'; then
            echo "present=oui" >> "$GITHUB_OUTPUT"
          else
            echo "present=non" >> "$GITHUB_OUTPUT"
          fi
          case "$(printf '%s' "$MAPBOX_SATELLITE" | tr -d '[:space:]' | tr 'A-Z' 'a-z')" in
            oui|true|1|yes) echo "satellite=oui" >> "$GITHUB_OUTPUT" ;;
            *) echo "satellite=non" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: APK d'essai des deux versions (même code minifié que les versions publiées)
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_SATELLITE: ${{ steps.mapbox.outputs.satellite }}
        run: |
          ./gradlew :app:assembleGithubSmoke :app:packagePlaySmokeUniversalApk --console=plain -Pvelogo.buildNumber=${{ github.run_number }}
          APK_PLAY=app/build/outputs/apk_from_bundle/playSmoke/app-play-smoke-universal.apk
          test -f "$APK_PLAY" || { echo "::error::APK tiré du fichier AAB introuvable"; ls -R app/build/outputs | head -n 60; exit 1; }
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          # Google Play exige des bibliothèques natives alignées sur 16 Ko dans les APK qu'il distribue.
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK_PLAY"
          python3 outils/controle_apk.py pages "$APK_PLAY"
          python3 outils/controle_apk.py mapbox app/build/outputs/apk/github/smoke/app-github-smoke.apk "${{ steps.mapbox.outputs.present }}"

      - name: Accélération matérielle pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # L'émulateur démarre parfois sans réseau utilisable (fabrications n° 30 et 31 : son Wi-Fi ne résolvait
      # aucun nom). L'essai le constate avant de commencer, l'écrit dans essai/sans_reseau.txt et s'arrête : on
      # recommence alors une fois, sur un émulateur neuf. Un échec de l'appli, lui, n'est jamais rejoué.
      # Cartes de Mapbox : l'essai vérifie toujours qu'elles sont proposées (si le jeton est là) et que l'accord est
      # demandé. Il n'en affiche une que si le message du dernier commit contient « [essai mapbox] » : Mapbox compte
      # chaque appareil qui affiche une de ses cartes dans le mois, et chaque émulateur neuf en est un de plus.
      - name: Sortie simulée sur émulateur
        id: essai
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VELOGO_MAPBOX_JETON: ${{ steps.mapbox.outputs.present }}
          VELOGO_MAPBOX_SATELLITE: ${{ steps.mapbox.outputs.satellite }}
          VELOGO_MAPBOX_AFFICHER: ${{ contains(github.event.head_commit.message, '[essai mapbox]') && 'oui' || 'non' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # Moteur graphique ANGLE (« swangle ») : avec le rendu logiciel par défaut (« swiftshader »), l'émulateur
          # n'affiche ni les textes ni le repère de position des cartes MapLibre, alors que l'appli est correcte.
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 outils/essai_emulateur.py app/build/outputs/apk/github/smoke/app-github-smoke.apk app/build/outputs/apk_from_bundle/playSmoke/app-play-smoke-universal.apk

      - name: Sortie simulée sur émulateur (seconde tentative, le premier émulateur n'avait pas de réseau)
        id: essai2
        if: steps.essai.outcome == 'failure' && hashFiles('essai/sans_reseau.txt') != ''
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VELOGO_MAPBOX_JETON: ${{ steps.mapbox.outputs.present }}
          VELOGO_MAPBOX_SATELLITE: ${{ steps.mapbox.outputs.satellite }}
          VELOGO_MAPBOX_AFFICHER: ${{ contains(github.event.head_commit.message, '[essai mapbox]') && 'oui' || 'non' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 outils/essai_emulateur.py app/build/outputs/apk/github/smoke/app-github-smoke.apk app/build/outputs/apk_from_bundle/playSmoke/app-play-smoke-universal.apk

      # Le premier essai est autorisé à échouer pour laisser sa chance au second : c'est ici que l'échec compte.
      - name: Verdict de l'essai
        if: always() && steps.essai.outcome != 'success' && steps.essai2.outcome != 'success'
        run: |
          echo "::error::L'essai sur émulateur a échoué (premier essai : ${{ steps.essai.outcome }}, second : ${{ steps.essai2.outcome }}). Le détail est dans le journal de l'étape « Sortie simulée sur émulateur »."
          exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: essai-emulateur
          path: essai/
          if-no-files-found: warn

  # La version n'est publiée qu'une fois l'essai de bout en bout réussi : ce qui arrive dans les Releases, et donc
  # sur le téléphone, a tourné sur un vrai Android.
  # « [sans publication] » dans le message du dernier commit poussé : tout est déroulé (tests, essai sur
  # émulateur) mais rien n'est publié. Pour les changements qui ne touchent pas l'appli (essais, outils, notes) :
  # une version identique à la précédente ne ferait que proposer une mise à jour pour rien.
  publication:
    name: Publication dans les Releases
    needs: [apk, essai]
    if: needs.apk.outputs.signe == 'oui' && !contains(github.event.head_commit.message, '[sans publication]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: VeloGo-${{ needs.apk.outputs.version }}

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          {
            echo "## VeloGo $VERSION"
            echo
            awk '/^## /{n++} n==1{print}' docs/NOUVEAUTES.md | tail -n +2
            echo
            echo "**Installation** : télécharge \`VeloGo-$VERSION.apk\` ci-dessous sur ton téléphone et ouvre-le. Il se met à jour par-dessus la version déjà installée, sans rien effacer."
            echo
            echo "Si un Samsung refuse l'installation : paramètres du téléphone > Sécurité et confidentialité > Bloqueur automatique, à désactiver le temps d'installer."
            echo
            echo "Le fichier \`VeloGo-$VERSION-play.aab\` ne s'installe pas sur un téléphone : c'est la même version, au format que demande la Google Play Console (voir \`docs/PLAY_STORE.md\`)."
          } > notes.md
          gh release create "v$VERSION" "VeloGo-$VERSION.apk" "VeloGo-$VERSION-play.aab" \
            --title "VeloGo $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "### VeloGo $VERSION publié" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          # On ne garde que les 8 dernières versions de l'appli (les Releases de cartes ne sont pas touchées).
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.createdAt) | reverse | .[8:] | .[].tagName' \
            | while read -r TAG; do gh release delete "$TAG" --yes --cleanup-tag || true; done
